services:
  - type: web
    name: telegram-bots
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false          # токен бота "сингулярное ядро + GRAM экономика"
      - key: BOT_TOKEN_DATA
        sync: false          # токен бота "регистрационный анализ" (/reg1 и т.д.)
      - key: ADMIN_ID_DATA
        sync: false          # ваш telegram id — доступ к админ-панели regbot
    disk:
      name: bots-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
