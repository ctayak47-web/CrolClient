plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.16'
    id 'org.parchmentmc.librarian' version '1.+'
}

group = 'com.autobuy'
version = '1.0.0'
archivesBaseName = 'autobuy'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'parchment', version: '1.21.4-2024.01.14-1.21.4'
    
    runs {
        client {
            workingDirectory project.file('run')
            
            property 'forge.logging.markers.com.autobuy', 'SCAN'
            property 'forge.logging.level.com.autobuy', 'debug'
            
            mods {
                autobuy {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run/server')
            
            property 'forge.logging.markers.com.autobuy', 'SCAN'
            property 'forge.logging.level.com.autobuy', 'debug'
            
            mods {
                autobuy {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.4-52.0.18'
    
    implementation 'com.google.code.gson:gson:2.10.1'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'      : 'autobuy',
            'Specification-Vendor'     : 'AutoBuy',
            'Specification-Version'    : '1',
            'Implementation-Title'     : project.name,
            'Implementation-Version'   : project.version,
            'Implementation-Vendor'    : 'AutoBuy',
            'Implementation-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }
}

jar {
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
